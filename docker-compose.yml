name: bookstore-dev
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME:-bookstore}
      POSTGRES_USER: ${DB_USER:-bookstore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bookstore_dev_only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bookstore} -d ${DB_NAME:-bookstore}"]
      interval: 5s
      timeout: 3s
      retries: 25

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    environment:
      NODE_ENV: development
      PORT: "4000"
      CORS_ORIGIN: http://localhost:${WEB_PORT:-3000}
      DATABASE_URL: postgresql://${DB_USER:-bookstore}:${DB_PASSWORD:-bookstore_dev_only}@db:5432/${DB_NAME:-bookstore}?schema=public
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    command: >-
      sh -c "npm install --no-audit --no-fund
      && npx prisma generate
      && npx prisma db push
      && npm run db:seed
      && npm run start:dev"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../bookstore-frontend
      dockerfile: Dockerfile.dev
    working_dir: /app
    environment:
      NODE_ENV: development
      API_INTERNAL_URL: http://api:4000/api
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - ../bookstore-frontend:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    command: >-
      sh -c "npm install --no-audit --no-fund && npm run dev -- --hostname 0.0.0.0"
    depends_on:
      - api

volumes:
  postgres_data:
  api_node_modules:
  web_node_modules:
  web_next:
